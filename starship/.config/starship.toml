"$schema" = 'https://starship.rs/config-schema.json'

# Compact path and Git prompt; Kubernetes/AWS context lives in Ghostty's title.
# Icons use Ghostty's bundled Symbols Nerd Font fallback; no font override needed.
add_newline = false
format = '$username$hostname$directory$git_branch$git_commit$git_state$git_status$nodejs$python$golang$rust$zig$docker_context$cmd_duration$status$jobs$character'

[directory]
format = '[ $path]($style)[$read_only]($read_only_style) '
truncation_length = 3
truncate_to_repo = true
truncation_symbol = '…/'
style = 'bold blue'
read_only = ' ro'

[git_branch]
format = '[git:$branch]($style) '
style = 'bold purple'

[git_commit]
commit_hash_length = 7
format = '[@$hash]($style) '
style = 'bold purple'

[git_status]
format = '([$all_status$ahead_behind]($style) )'
style = 'bold yellow'
conflicted = '=${count}'
ahead = '↑${count}'
behind = '↓${count}'
diverged = '↑${ahead_count}↓${behind_count}'
untracked = '?${count}'
stashed = '*${count}'
modified = '!${count}'
staged = '+${count}'
renamed = 'r${count}'
deleted = '-${count}'

[nodejs]
format = '[node $version]($style) '

[python]
format = '[py $version( \($virtualenv\))]($style) '

[golang]
format = '[go $version]($style) '

[rust]
format = '[rust $version]($style) '

[zig]
format = '[zig $version]($style) '

[docker_context]
format = '[docker $context]($style) '
only_with_files = true

[cmd_duration]
min_time = 2000
format = '[took $duration]($style) '
style = 'dimmed yellow'

[status]
disabled = false
format = '[exit $status]($style) '
style = 'bold red'

[jobs]
symbol = 'bg '
number_threshold = 1
symbol_threshold = 1
format = '[$symbol$number]($style) '
style = 'bold blue'

[character]
success_symbol = '[❯](bold green)'
error_symbol = '[❯](bold red)'
vimcmd_symbol = '[❮](bold cyan)'
